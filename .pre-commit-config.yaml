default_language_version:
  python: python3.14

exclude: >
  (?x)^(
    .*\.pytest_cache/|
    .*\.ruff_cache/|
    .*\.venv/|
    .*/attachments/|
    .*/logs/|
    .*/output/|
    .*credentials\.json|
    .*token\.json|
    .*signature\.enc
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

