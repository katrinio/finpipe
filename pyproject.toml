[tool.poetry]
name = "invoice-automation"
version = "0.1.0"
description = "Monthly salary invoice and bank PDF automation."
authors = ["Katrin"]
readme = "README.md"
packages = [
    { include = "src" },
]

[tool.poetry.scripts]
start_bot = "src.integrations.telegram.bot:main"

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
pypdf = "^6.1.0"
reportlab = "^4.4.0"
google-api-python-client = "^2.196.0"
google-auth-httplib2 = "^0.4.0"
google-auth-oauthlib = "^1.4.0"
python-dotenv = "^1.2.2"
docxtpl = "^0.20.2"
sqlalchemy = "^2.0.41"
psycopg = { version = "^3.2.0", extras = ["binary"] }
pillow = "^12.2.0"
faker = "^40.21.0"
cryptography = "^48.0.0"
types-pyyaml = "^6.0.12.20260518"
fastapi = "^0.136.3"
uvicorn = "^0.49.0"
rich = "^15.0.0"
httpx2 = "^2.4.0"
alembic = "^1.18.4"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)s:%(name)s:%(message)s"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
skip_empty = true
show_missing = true
omit = [
    "src/constants.py",
    "src/**/__init__.py",
]

exclude_lines = [
    "if __name__ == .__main__.:",
    "raise SystemExit",
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = false
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "google_auth_oauthlib.*",
    "googleapiclient.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
line-length = 150

[tool.ruff.lint]
select = [
    "F",
    "E","W",
    "I",
    "UP",
    "B",
    "SIM",
    "RET",
    "RUF",
    "PLE",
    "PLW",
    "PLR",
    "PT"
]
ignore = [
    "E731", # allow lambdas
    "PT018", # allow multiple in-place asserts
    "B023", # allow lambda definition closurures
    "B904", # allow raise() withot implicit from
    "B905", # allow strictless zip
    "B024", # allow ABC without abstract methods
    "W605", # supress `Invalid escape sequence`, works bad
    "RUF001", "RUF002", "RUF003", # unicode check ignore in strings
    "RUF012", # allow mutable class attrs withoout ClassVar annotaion
    "PLR2004", "PLR0913", "PLR0915", "PLR0911", "PLR0912", # supress over check in pylint
    "PLR1704", # new overcheck of pylint (e.g. `with session as session`)
    "PLW0108", # allow lambda in place
    "COM812", "ISC001", # ruff format conflicts disable
    "SIM113", # over simplification for enumarates
    "SIM103", # not good for implicity checks
    "UP037", # allow quotes from type annotation
]
exclude = [
    ".git",
    ".venv",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[dependency-groups]
dev = [
    "ruff>=0.15.14,<0.16.0",
    "mypy==1.19.1",
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pre-commit>=4.6.0,<5.0.0",
    "types-reportlab",
]
