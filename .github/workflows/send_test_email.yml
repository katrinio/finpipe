name: Send Test Email

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: Email address to send the test message to
        required: true
        type: string
      email_dry_run:
        description: Set to true to skip real Gmail sending
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  send-test-email:
    runs-on: ubuntu-latest

    env:
      GMAIL_CREDENTIALS_PATH: ${{ github.workspace }}/credentials.json
      GMAIL_TOKEN_PATH: ${{ github.workspace }}/token.json
      TEST_EMAIL: ${{ inputs.test_email }}
      EMAIL_DRY_RUN: ${{ inputs.email_dry_run }}
      EMAIL_DRY_RUN_RECIPIENT: ${{ vars.EMAIL_DRY_RUN_RECIPIENT }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Create Google credentials files
        run: |
          printf '%s' '${{ secrets.GMAIL_CREDENTIALS_JSON }}' > "${GMAIL_CREDENTIALS_PATH}"
          printf '%s' '${{ secrets.GMAIL_TOKEN_JSON }}' > "${GMAIL_TOKEN_PATH}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Send test email
        run: |
          poetry run python -m src.workflows.send_test_email

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f "${GMAIL_CREDENTIALS_PATH}"
          rm -f "${GMAIL_TOKEN_PATH}"
