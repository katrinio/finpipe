name: LibreOffice Check

on:
  workflow_dispatch:
  pull_request:

jobs:
  libreoffice:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Verify installation
        run: |
          which soffice
          soffice --version
