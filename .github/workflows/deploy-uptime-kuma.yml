name: ⏱️ Deploy Uptime Kuma

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'uptime-kuma.compose.yml'
      - '.github/workflows/deploy-uptime-kuma.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Uptime Kuma via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail
            cd ~/projects/the-hub-infra/docker

            git fetch origin
            git reset --hard origin/main

            docker compose -f uptime-kuma.compose.yml up -d --remove-orphans

            docker compose -f uptime-kuma.compose.yml ps

            docker image prune -f
