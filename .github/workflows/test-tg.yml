name: Run TG Bot Tests

on:
  push:

jobs:
  tests-tg:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install


      - name: Run TG Bot Tests
        run: |
          poetry run pytest tests/external -vv -ra
