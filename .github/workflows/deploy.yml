name: 🚀 Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            cd ~/projects/finpipe

            git fetch origin
            git reset --hard origin/main

            docker compose build finpipe
            docker compose up -d

            docker compose ps
            docker compose logs --tail=30 finpipe
            
            docker image prune -f
