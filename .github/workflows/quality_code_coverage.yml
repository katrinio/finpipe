name: 🎯 Code Coverage

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  coverage:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finpipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finpipe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SIGNATURE_ENCRYPTION_KEY: ${{ secrets.SIGNATURE_ENCRYPTION_KEY }}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/finpipe_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Debug database url
        run: echo "DATABASE_URL=${DATABASE_URL}"

      - name: Generate coverage report
        run: |
          poetry run pytest tests/unit \
            --cov=src \
            --cov-report=xml \
            -ra

      - name: Validate coverage
        run: |
          poetry run coverage report | tee -a "$GITHUB_STEP_SUMMARY"
          poetry run coverage report --fail-under=70 > /dev/null
