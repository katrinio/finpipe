name: 🎯 Code Coverage

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  coverage:
    runs-on: ubuntu-latest

    env:
      SIGNATURE_ENCRYPTION_KEY: ${{ secrets.SIGNATURE_ENCRYPTION_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Generate coverage report
        run: |
          poetry run pytest tests/unit \
            --cov=src \
            --cov-report=xml \
            -ra

      - name: Validate coverage
        run: |
          poetry run coverage report | tee -a "$GITHUB_STEP_SUMMARY"
          poetry run coverage report --fail-under=70 > /dev/null