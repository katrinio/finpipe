name: ⏰ Healthcheck

on:
  workflow_dispatch:

jobs:
  daily-healthcheck:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      BOT_OWNER_TELEGRAM_ID: ${{ secrets.BOT_OWNER_TELEGRAM_ID }}
      TELEGRAM_ADMIN_USERNAME: ${{ secrets.TELEGRAM_ADMIN_USERNAME }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Record start time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Run Unit Tests
        id: units
        continue-on-error: true
        run: |
          poetry run pytest tests/unit -vv -ra

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Run Integration Tests
        id: integration
        continue-on-error: true
        run: |
          poetry run pytest tests/integration -vv -ra

      - name: Run Telegram Health Check
        id: telegram
        continue-on-error: true
        run: |
          poetry run pytest tests/external/test_external_telegram.py -vv

      - name: Calculate duration
        if: always()
        run: |
          echo "DURATION=$(( $(date +%s) - $START_TIME ))" >> $GITHUB_ENV

      - name: Send Health Report
        env:
          UNIT_STATUS: ${{ steps.units.outcome }}
          INTEGRATION_STATUS: ${{ steps.integration.outcome }}
          TELEGRAM_STATUS: ${{ steps.telegram.outcome }}
          DURATION: ${{ env.DURATION }}
        run: |
          poetry run python -m src.workflows.run_daily_healthcheck
          

      - name: Send Health Failure
        if: failure()
        run: |
          PIPELINE_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      
          curl -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.BOT_OWNER_TELEGRAM_ID }}" \
            -d text="❌ Healthcheck failed
      
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          
          🔗 Pipeline: ${PIPELINE_URL}"
