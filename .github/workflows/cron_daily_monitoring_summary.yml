name: 📊 Daily Monitoring Summary

on:
  schedule:
    # 07:00 Belgrade currently corresponds to 05:00 UTC.
    # Adjust if DST shifts the local offset.
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  daily-monitoring-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Run monitoring summary on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" 'cd ~/projects/finpipe && docker compose exec -T finpipe-bot python -m src.workflows.monitoring.daily_report'
