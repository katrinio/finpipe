name: 🔍 Bot Listener

on:
  workflow_dispatch:

jobs:
  bot-listener:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ACCOUNT_HOLDER: ${{ secrets.ACCOUNT_HOLDER }}
      ACCOUNT_HOLDER_ADDRESS: ${{ secrets.ACCOUNT_HOLDER_ADDRESS }}
      ACCOUNT_BIC: ${{ secrets.ACCOUNT_BIC }}
      ACCOUNT_IBAN: ${{ secrets.ACCOUNT_IBAN }}
      ACCOUNT_NUMBER: ${{ secrets.ACCOUNT_NUMBER }}
      BANK_NAME: ${{ secrets.BANK_NAME }}
      COMPANY_NAME: ${{ secrets.COMPANY_NAME }}
      COMPANY_ADDRESS: ${{ secrets.COMPANY_ADDRESS }}
      INVOICE_AMOUNT: ${{ secrets.INVOICE_AMOUNT }}
      SERVICE_AGREEMENT_DATE: ${{ secrets.SERVICE_AGREEMENT_DATE }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Run Telegram Bot Listener
        id: telegram
        continue-on-error: true
        run: |
          poetry run python -m src.integrations.telegram.bot
