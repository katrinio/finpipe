name: 🔍 Bot Listener

on:
  workflow_dispatch:

jobs:
  bot-listener:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      BOT_OWNER_TELEGRAM_ID: ${{ secrets.BOT_OWNER_TELEGRAM_ID }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install


      - name: Run Telegram Bot Listener
        id: telegram
        continue-on-error: true
        run: |
          poetry run python -m src.integrations.telegram.bot

      - name: Send Telegram Bot Listener Failure
        if: failure()
        run: |
          PIPELINE_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      
          curl -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.BOT_OWNER_TELEGRAM_ID }}" \
            -d text="❌ Telegram Bot Listener Failure
      
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          
          🔗 Pipeline: ${PIPELINE_URL}"
