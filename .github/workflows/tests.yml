name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Run Ruff
        run: |
          poetry run ruff check .

  tests:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        suite:
          - unit
          - integration

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Install LibreOffice
        if: matrix.suite == 'integration'
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Run tests
        run: |
          poetry run pytest tests/${{ matrix.suite }} -vv -ra
