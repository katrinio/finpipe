name: 🚀 Deploy Finpipe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'Dockerfile.postgres'
      - 'docker-compose.yml'
      - 'docker-compose.local.yml'
      - 'scripts/**'
      - '.github/workflows/deploy-finpipe.yml'
      - '.env.dist'
      - 'pyproject.toml'
      - 'poetry.lock'

concurrency:
  group: deploy-finpipe
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Finpipe via SSH
        env:
          FINPIPE_VPS_HOST: ${{ secrets.VPS_HOST }}
          FINPIPE_VPS_USER: ${{ secrets.VPS_USER }}
          FINPIPE_VPS_PORT: ${{ secrets.VPS_PORT }}
          FINPIPE_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077

          ssh_key_path="${RUNNER_TEMP}/finpipe-deploy-key"
          deploy_script_path="${RUNNER_TEMP}/finpipe-deploy.sh"
          trap 'rm -f "$ssh_key_path" "$deploy_script_path"' EXIT

          printf '%s\n' "$FINPIPE_VPS_SSH_KEY" > "$ssh_key_path"
          cat > "$deploy_script_path" <<'REMOTE_SCRIPT'
            set -euo pipefail
            cd ~/projects/finpipe

            git fetch origin
            git reset --hard origin/main

            if [ ! -f .env ]; then
              echo "ERROR: missing production .env"
              exit 1
            fi

            # These values must come only from Infisical in production. Unsetting
            # them prevents legacy .env values from satisfying the preflight.
            unset DATABASE_URL SIGNATURE_ENCRYPTION_KEY TELEGRAM_BOT_TOKEN INFISICAL_TOKEN

            if ! command -v infisical >/dev/null 2>&1; then
              echo "ERROR: Infisical CLI is not installed"
              exit 1
            fi

            infisical_auth_file="${INFISICAL_AUTH_FILE:-$HOME/.config/infisical/finpipe-auth.env}"
            if [ ! -r "$infisical_auth_file" ]; then
              echo "ERROR: Infisical Machine Identity credentials are missing or unreadable"
              exit 1
            fi

            source "$infisical_auth_file"
            : "${INFISICAL_CLIENT_ID:?INFISICAL_CLIENT_ID is missing}"
            : "${INFISICAL_CLIENT_SECRET:?INFISICAL_CLIENT_SECRET is missing}"
            : "${INFISICAL_PROJECT_ID:?INFISICAL_PROJECT_ID is missing}"

            INFISICAL_TOKEN="$(infisical login \
              --method=universal-auth \
              --client-id="$INFISICAL_CLIENT_ID" \
              --client-secret="$INFISICAL_CLIENT_SECRET" \
              --silent \
              --plain)"
            export INFISICAL_TOKEN
            unset INFISICAL_CLIENT_ID INFISICAL_CLIENT_SECRET

            infisical_run() {
              infisical run \
                --projectId="$INFISICAL_PROJECT_ID" \
                --env=prod \
                --path=/finpipe \
                -- "$@"
            }

            # Complete all preflight checks while the current services are intact.
            infisical_run bash scripts/validate-production-config.sh
            infisical_run docker compose -f docker-compose.yml config --quiet
            infisical_run docker compose -f docker-compose.yml build

            if ! infisical_run docker compose -f docker-compose.yml up -d --wait --wait-timeout 120 postgres --remove-orphans; then
              infisical_run docker compose -f docker-compose.yml ps postgres
              infisical_run docker compose -f docker-compose.yml logs --tail=100 postgres
              exit 1
            fi

            schema_migrated=0
            restore_old_bot_on_failure() {
              exit_code=$?
              trap - EXIT
              if [ "$exit_code" -ne 0 ] && [ "$schema_migrated" -eq 0 ]; then
                infisical_run docker compose -f docker-compose.yml start finpipe-bot || true
              fi
              exit "$exit_code"
            }
            trap restore_old_bot_on_failure EXIT

            infisical_run docker compose -f docker-compose.yml stop finpipe-bot
            infisical_run docker compose -f docker-compose.yml run --rm finpipe-bot python -m src.workflows.monitoring.backup_database
            infisical_run docker compose -f docker-compose.yml run --rm finpipe-bot alembic upgrade head
            schema_migrated=1

            if ! infisical_run docker compose -f docker-compose.yml up -d --wait --wait-timeout 120 finpipe-bot --remove-orphans; then
              infisical_run docker compose -f docker-compose.yml ps
              infisical_run docker compose -f docker-compose.yml logs --tail=100 finpipe-bot
              echo "New bot failed readiness after schema migration; automatic rollback is intentionally disabled."
              exit 1
            fi

            trap - EXIT

            infisical_run docker compose -f docker-compose.yml ps
            infisical_run docker compose -f docker-compose.yml logs --tail=30 finpipe-bot

            docker image prune -f
          REMOTE_SCRIPT

          for attempt in 1 2 3; do
            echo "SSH deploy attempt ${attempt}/3"
            set +e
            timeout 20m ssh \
              -i "$ssh_key_path" \
              -p "$FINPIPE_VPS_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=30 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              "$FINPIPE_VPS_USER@$FINPIPE_VPS_HOST" \
              'bash -se' < "$deploy_script_path"
            exit_code=$?
            set -e

            if [ "$exit_code" -eq 0 ]; then
              exit 0
            fi
            if [ "$exit_code" -ne 255 ]; then
              echo "Remote deploy failed with exit code ${exit_code}; not retrying."
              exit "$exit_code"
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "SSH transport failed; retrying in 10 seconds."
              sleep 10
            fi
          done

          echo "SSH transport failed after 3 attempts."
          exit 255
