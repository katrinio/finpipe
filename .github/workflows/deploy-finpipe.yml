name: 🚀 Deploy Finpipe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'Dockerfile.postgres'
      - 'docker-compose.yml'
      - 'docker-compose.local.yml'
      - 'scripts/**'
      - '.github/workflows/deploy-finpipe.yml'
      - '.env.dist'
      - 'pyproject.toml'
      - 'poetry.lock'

concurrency:
  group: deploy-finpipe
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Finpipe via SSH
        env:
          FINPIPE_VPS_HOST: ${{ secrets.VPS_HOST }}
          FINPIPE_VPS_USER: ${{ secrets.VPS_USER }}
          FINPIPE_VPS_PORT: ${{ secrets.VPS_PORT }}
          FINPIPE_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077

          ssh_key_path="${RUNNER_TEMP}/finpipe-deploy-key"
          deploy_script_path="${RUNNER_TEMP}/finpipe-deploy.sh"
          trap 'rm -f "$ssh_key_path" "$deploy_script_path"' EXIT

          printf '%s\n' "$FINPIPE_VPS_SSH_KEY" > "$ssh_key_path"
          cat > "$deploy_script_path" <<'REMOTE_SCRIPT'
            set -euo pipefail
            cd ~/projects/finpipe

            git fetch origin
            git reset --hard origin/main

            docker compose -f docker-compose.yml build
            docker compose -f docker-compose.yml up -d --wait --wait-timeout 120 postgres

            schema_migrated=0
            restore_old_bot_on_failure() {
              exit_code=$?
              trap - EXIT
              if [ "$exit_code" -ne 0 ] && [ "$schema_migrated" -eq 0 ]; then
                docker compose -f docker-compose.yml start finpipe-bot || true
              fi
              exit "$exit_code"
            }
            trap restore_old_bot_on_failure EXIT

            docker compose -f docker-compose.yml stop finpipe-bot
            docker compose -f docker-compose.yml run --rm finpipe-bot python -m src.workflows.monitoring.backup_database
            docker compose -f docker-compose.yml run --rm finpipe-bot alembic upgrade head
            schema_migrated=1

            if ! docker compose -f docker-compose.yml up -d --wait --wait-timeout 120 finpipe-bot --remove-orphans; then
              docker compose -f docker-compose.yml ps
              docker compose -f docker-compose.yml logs --tail=100 finpipe-bot
              echo "New bot failed readiness after schema migration; automatic rollback is intentionally disabled."
              exit 1
            fi

            trap - EXIT

            docker compose -f docker-compose.yml ps
            docker compose -f docker-compose.yml logs --tail=30 finpipe-bot

            docker image prune -f
          REMOTE_SCRIPT

          for attempt in 1 2 3; do
            echo "SSH deploy attempt ${attempt}/3"
            set +e
            timeout 20m ssh \
              -i "$ssh_key_path" \
              -p "$FINPIPE_VPS_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=30 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              "$FINPIPE_VPS_USER@$FINPIPE_VPS_HOST" \
              'bash -se' < "$deploy_script_path"
            exit_code=$?
            set -e

            if [ "$exit_code" -eq 0 ]; then
              exit 0
            fi
            if [ "$exit_code" -ne 255 ]; then
              echo "Remote deploy failed with exit code ${exit_code}; not retrying."
              exit "$exit_code"
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "SSH transport failed; retrying in 10 seconds."
              sleep 10
            fi
          done

          echo "SSH transport failed after 3 attempts."
          exit 255
