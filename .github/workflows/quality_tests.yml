name: 🧪 Quality Gates

on:
  push:
    branches:
      - main
  pull_request:

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  SIGNATURE_ENCRYPTION_KEY: ${{ secrets.SIGNATURE_ENCRYPTION_KEY }}
  BOT_OWNER_TELEGRAM_ID: ${{ secrets.BOT_OWNER_TELEGRAM_ID }}
  BOT_OWNER_TELEGRAM_USERNAME: ${{ secrets.BOT_OWNER_TELEGRAM_USERNAME }}
  TEST_DATABASE_URL: postgresql+psycopg://finpipe:finpipe@localhost:5432/finpipe_test

jobs:
  code-style:
    name: 🎨 Code Style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Run Ruff
        run: poetry run ruff check .

      - name: Run MyPy
        run: poetry run mypy src

  tests:
    name: 🧪 Tests
    needs: code-style
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: finpipe
          POSTGRES_PASSWORD: finpipe
          POSTGRES_DB: finpipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finpipe -d finpipe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Run Unit Tests
        run: |
          poetry run pytest tests/unit \
            -q \
            -ra \
            -o log_cli=false

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Run Integration Tests
        run: |
          poetry run pytest tests/integration \
            -q \
            -ra \
            -o log_cli=false

  coverage:
    name: 📊 Coverage
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: finpipe
          POSTGRES_PASSWORD: finpipe
          POSTGRES_DB: finpipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finpipe -d finpipe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Run coverage
        run: |
          poetry run pytest tests \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            -q \
            -ra \
            -o log_cli=false
