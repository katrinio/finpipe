name: 🧪 Run Quality Gates

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  code-style:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Run Ruff
        run: poetry run ruff check .

      - name: Run MyPy
        run: poetry run mypy src

  tests:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: finpipe
          POSTGRES_PASSWORD: finpipe
          POSTGRES_DB: finpipe_test

        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finpipe -d finpipe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    strategy:
      fail-fast: false
      matrix:
        suite:
          - unit
          - integration

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      SIGNATURE_ENCRYPTION_KEY: ${{ secrets.SIGNATURE_ENCRYPTION_KEY }}
      BOT_OWNER_TELEGRAM_ID: ${{ secrets.BOT_OWNER_TELEGRAM_ID }}
      BOT_OWNER_TELEGRAM_USERNAME: ${{ secrets.BOT_OWNER_TELEGRAM_USERNAME }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Debug database url
        run: |
          echo "TEST_DATABASE_URL=${TEST_DATABASE_URL}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Install LibreOffice
        if: matrix.suite == 'integration'
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Run tests
        run: |
          if [ "${{ matrix.suite }}" = "unit" ]; then
            poetry run pytest tests/unit
          else
            poetry run pytest tests/integration -ra
          fi
