name: 🌚 Generate Invoice (On Hold)
# Disabled scheduled execution.
# Preserved for future automation work.
# Run manually if needed.

on:
  workflow_dispatch:

jobs:
  invoice:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      BOT_OWNER_TELEGRAM_ID: ${{ secrets.BOT_OWNER_TELEGRAM_ID }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Generate and send invoice
        run: |
          poetry run python -m src.workflows.run_invoice_delivery
          curl -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.BOT_OWNER_TELEGRAM_ID }}" \
            -d text="✅ Finpipe invoice generation success"

      - name: Invoice Failed Report
        if: failure()
        run: |
          curl -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.BOT_OWNER_TELEGRAM_ID }}" \
            -d text="❌ Finpipe invoice generation failed"
