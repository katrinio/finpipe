name: 📡 Deploy Monitoring

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infra/monitoring.compose.yml'
      - 'infra/prometheus.yml'
      - 'infra/alloy-config.alloy'
      - 'docs/monitoring.md'
      - '.github/workflows/deploy-monitoring.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Monitoring via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail
            cd ~/projects/finpipe

            git fetch origin
            git reset --hard origin/main

            docker compose -f infra/monitoring.compose.yml pull --quiet
            docker compose -f infra/monitoring.compose.yml up -d --remove-orphans

            docker compose -f infra/monitoring.compose.yml ps
            docker compose -f infra/monitoring.compose.yml logs --tail=20 grafana

            docker image prune -f
