name: 🐳 Build CI Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-ci-image:
    name: 🐳 Build and Push CI Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/ci/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/finpipe-ci:latest
            ghcr.io/${{ github.repository_owner }}/finpipe-ci:${{ github.sha }}