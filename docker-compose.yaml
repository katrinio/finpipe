services:
  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: finpipe
      POSTGRES_USER: finpipe
      POSTGRES_PASSWORD: finpipe

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpipe -d finpipe"]
      interval: 10s
      timeout: 5s
      retries: 5

  finpipe:
    build: .

    environment:
      DATABASE_URL: postgresql+psycopg://finpipe:finpipe@postgres:5432/finpipe

    depends_on:
      postgres:
        condition: service_healthy
