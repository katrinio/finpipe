services:
  postgres:
    image: postgres:17

    ports:
      - "5433:5432"

    environment:
      POSTGRES_DB: finpipe
      POSTGRES_USER: finpipe
      POSTGRES_PASSWORD: finpipe

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpipe -d finpipe"]
      interval: 10s
      timeout: 5s
      retries: 5

  finpipe:
    build: .

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://finpipe:finpipe@postgres:5432/finpipe

    volumes:
      - ~/finpipe-secrets/credentials.json:/app/credentials.json:ro
      - ~/finpipe-secrets/token.json:/app/token.json:ro

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: