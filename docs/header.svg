<svg viewBox="0 0 680 260" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Finpipe flow to PROFIT</title>
<desc>Invoice and bank email flow into the bot, go to your phone, ??? and PROFIT</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .lbl    { font: 400 12px sans-serif; fill: #999; }
    .qqq    { font: 700 18px sans-serif; fill: #777; }
    .profit { font: 700 22px sans-serif; fill: #4ade80; }
    @keyframes flow { 0%{stroke-dashoffset:60} 100%{stroke-dashoffset:0} }
    @keyframes pop  { 0%,100%{opacity:0.5;transform:scale(0.92)} 50%{opacity:1;transform:scale(1)} }
    .f1 { stroke-dasharray:7 4; animation: flow 1.6s linear infinite; }
    .f2 { stroke-dasharray:7 4; animation: flow 1.6s 0.5s linear infinite; }
    .bot { animation: pop 2s ease-in-out infinite; transform-origin: 300px 130px; }
    .profit-grp { animation: pop 2s 0.6s ease-in-out infinite; transform-origin: 610px 128px; }
  </style>
</defs>

<rect x="0" y="0" width="680" height="260" rx="0" fill="#0d1117"/>
<rect x="20" y="20" width="640" height="220" rx="14" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>

<text x="100" y="96"  text-anchor="middle" font-size="36">🧾</text>
<text x="100" y="118" text-anchor="middle" class="lbl">invoice</text>

<text x="100" y="178" text-anchor="middle" font-size="36">📩</text>
<text x="100" y="200" text-anchor="middle" class="lbl">bank mail</text>

<path d="M132 88 Q216 88 268 122"   fill="none" stroke="#444" stroke-width="1.8" class="f1" marker-end="url(#arrow)"/>
<path d="M132 168 Q216 168 268 142" fill="none" stroke="#444" stroke-width="1.8" class="f2" marker-end="url(#arrow)"/>

<text x="300" y="142" text-anchor="middle" font-size="44" class="bot">⚙️</text>

<line x1="336" y1="128" x2="376" y2="128" stroke="#444" stroke-width="1.8" class="f1" marker-end="url(#arrow)"/>

<text x="410" y="142" text-anchor="middle" font-size="36">📱</text>
<text x="410" y="164" text-anchor="middle" class="lbl">chat</text>

<line x1="440" y1="128" x2="476" y2="128" stroke="#444" stroke-width="1.8" class="f2" marker-end="url(#arrow)"/>

<text x="510" y="138" text-anchor="middle" class="qqq">???</text>

<line x1="536" y1="128" x2="562" y2="128" stroke="#444" stroke-width="1.8" class="f1" marker-end="url(#arrow)"/>

<g class="profit-grp">
  <text x="610" y="118" text-anchor="middle" font-size="26">💶</text>
  <text x="610" y="142" text-anchor="middle" class="profit">PROFIT</text>
</g>

</svg>
