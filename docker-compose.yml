services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: finpipe
      POSTGRES_USER: finpipe
      POSTGRES_PASSWORD: finpipe

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      finpipe:
      shared:
        aliases:
          - finpipe-postgres

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpipe -d finpipe"]
      interval: 10s
      timeout: 5s
      retries: 5

  finpipe-bot:
    build: .
    restart: unless-stopped
    container_name: finpipe-bot

    labels:
      com.katrin.logs.app: "finpipe-bot"
      com.katrin.logs.environment: "production"

    command: python -m src.integrations.telegram.bot

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://finpipe:finpipe@postgres:5432/finpipe
      TEST_DATABASE_URL: ""
      CONTAINER_NAME: finpipe-bot

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - finpipe

volumes:
  postgres_data:
    name: finpipe_postgres_data  # Точное имя существующего volume на VPS

networks:
  finpipe:
  shared:
    name: finpipe-shared
