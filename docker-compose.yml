services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups:ro

    networks:
      - finpipe

    healthcheck:
      test: ["CMD", "pg_isready", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  finpipe-bot:
    build:
      context: .
      target: production
    restart: unless-stopped
    entrypoint: ["python", "/app/scripts/bot_container_runtime.py"]
    command: python -m src.integrations.telegram.bot

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      TEST_DATABASE_URL: ""

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./backups:/app/backups

    healthcheck:
      test:
        ["CMD", "python", "/app/scripts/bot_container_runtime.py", "python", "-m", "src.workflows.readiness"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 5s

    networks:
      - finpipe

volumes:
  postgres_data:
    name: finpipe_postgres_data  # Точное имя существующего volume на VPS

networks:
  finpipe:
