services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: finpipe
      POSTGRES_USER: finpipe
      POSTGRES_PASSWORD: finpipe

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - finpipe

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpipe -d finpipe"]
      interval: 10s
      timeout: 5s
      retries: 5

  finpipe-bot:
    build: .
    restart: unless-stopped
    command: python -m src.integrations.telegram.bot

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://finpipe:finpipe@postgres:5432/finpipe
      TEST_DATABASE_URL: ""

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - finpipe

volumes:
  postgres_data:
    name: finpipe_postgres_data  # Точное имя существующего volume на VPS

networks:
  finpipe:
