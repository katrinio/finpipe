# company data (employer)
company_name:
company_address:
company_email:
service_agreement_date:
registration_number:
city:

# example
# company_name: Acme Software LLC
# company_address: 123 Main Street, London, UK
# company_email: accounting@acme.com
# service_agreement_date: 2025-01-01
# registration_number: 12345678
# city: London


# bank account data
account_holder:
bic:
iban:
account_number:
account_holder_email:
account_holder_address:

# example
# account_holder: Ivan Ivanov PR Consulting
# bic: ABCDRSBG
# iban: RS35105008123123123123
# account_number: 123-123123123123-12
# account_holder_email: ivan@example.com
# account_holder_address: Knez Mihailova 1, Belgrade, Serbia


# bank (used in invoice PDF)
bank_name:

# example
# bank_name: Alta Banka AD Beograd


# bank slug — selects the bank's email config (reply address, conversion request address)
# supported: altabanka
bank_slug:

# example
# bank_slug: altabanka


# bank notification email — used to find the incoming payment confirmation
bank_confirmation_email:
  recipient: ""
  subject_contains: ""

# example
# recipient: your@email.com
# subject_contains: obaveštenje o deviznom prilivu


# payment data
payment_number:
payment_code:
payment_description:

# example
# payment_number: 97
# payment_code: 289
# payment_description: Consulting services for May 2026
